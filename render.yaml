services:
  - type: web
    name: levelup-api
    runtime: node
    rootDir: .
    plan: standard
    region: oregon
    branch: main
    autoDeploy: true
    # Build flow:
    #   1. install
    #   2. prisma generate (codegen for the API)
    #   3. prisma migrate deploy — apply any new migrations to the prod DB
    #      so the API doesn't query columns that don't exist yet
    #   4. turbo build the API
    # The `start` step then runs db:seed once (idempotent upserts) so any new
    # learning paths land before the API starts serving traffic.
    buildCommand: pnpm install --frozen-lockfile --prod=false && pnpm --filter @levelup/db generate && pnpm --filter @levelup/db exec prisma migrate deploy && pnpm turbo run build --filter=@levelup/api...
    startCommand: pnpm --filter @levelup/db run seed || true; pnpm --filter @levelup/api start
    healthCheckPath: /api/health
    envVars:
      - key: NODE_ENV
        value: production
      - key: API_PORT
        value: 4000

      # White-label client — drives cert PDF + email branding.
      - key: CLIENT
        value: kapitus

      # Postgres (Supabase pooler)
      - key: DATABASE_URL
        sync: false
      - key: DIRECT_DATABASE_URL
        sync: false

      # Redis (Upstash recommended)
      - key: REDIS_URL
        sync: false

      # Supabase Auth + Storage
      - key: SUPABASE_URL
        sync: false
      - key: SUPABASE_ANON_KEY
        sync: false
      - key: SUPABASE_SERVICE_ROLE_KEY
        sync: false
      - key: SUPABASE_JWT_SECRET
        sync: false

      # OpenAI (coach + embeddings + voice)
      - key: OPENAI_API_KEY
        sync: false

      # Stripe
      - key: STRIPE_SECRET_KEY
        sync: false
      - key: STRIPE_WEBHOOK_SECRET
        sync: false
      - key: STRIPE_PRICE_STARTER
        sync: false
      - key: STRIPE_PRICE_GROWTH
        sync: false
      - key: STRIPE_PRICE_ENTERPRISE
        sync: false

      # Resend (transactional email)
      - key: RESEND_API_KEY
        sync: false
      - key: RESEND_FROM_EMAIL
        sync: false

      # Cert PDF HMAC signing key (REQUIRED — boot fails without it)
      - key: CERT_SIGNING_SECRET
        generateValue: true

      # Slack OAuth state HMAC (legacy, still consumed by integrations module)
      - key: SESSION_SECRET
        generateValue: true

      # CORS / cookie config
      # Comma-separated allow-list. main.ts splits on `,` and trims whitespace.
      # ceolawyer.ailevel.app is the second tenant (CEO Lawyer) served by a
      # separate Vercel project — see docs/runbooks/ceolawyer-vercel-deploy.md.
      - key: WEB_ORIGIN
        value: https://ailevel.app,https://ceolawyer.ailevel.app
      - key: COOKIE_DOMAIN
        value: .ailevel.app
      - key: NEXT_PUBLIC_API_URL
        sync: false

  - type: worker
    name: levelup-worker
    runtime: node
    rootDir: .
    plan: starter
    region: oregon
    branch: main
    autoDeploy: true
    buildCommand: pnpm install --frozen-lockfile --prod=false && pnpm --filter @levelup/db generate && pnpm turbo run build --filter=@levelup/worker...
    startCommand: pnpm --filter @levelup/worker start
    envVars:
      - key: NODE_ENV
        value: production

      # White-label client — drives cert PDF + email branding.
      - key: CLIENT
        value: kapitus

      - key: DATABASE_URL
        sync: false
      - key: DIRECT_DATABASE_URL
        sync: false
      - key: REDIS_URL
        sync: false

      - key: SUPABASE_URL
        sync: false
      - key: SUPABASE_SERVICE_ROLE_KEY
        sync: false

      - key: OPENAI_API_KEY
        sync: false
      - key: RESEND_API_KEY
        sync: false
      - key: RESEND_FROM_EMAIL
        sync: false

      - key: CERT_SIGNING_SECRET
        fromService:
          type: web
          name: levelup-api
          envVarKey: CERT_SIGNING_SECRET
