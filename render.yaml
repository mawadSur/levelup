services:
  - type: web
    name: levelup-api
    runtime: node
    rootDir: .
    plan: standard
    # ---------------------------------------------------------------------------
    # Single-region (CR.28). The API + worker run in oregon (us-west-2) because
    # Postgres (Supabase pooler) and Redis (Upstash) both live there — keeping
    # the round-trip on the same backbone shaves ~70ms off the median request.
    # A regional outage here takes the entire product down. The "go multi-region"
    # checklist (RTO 1h / RPO 5min, read replicas via Neon, Cloudflare LB,
    # promotion runbook) lives at docs/runbooks/multi-region.md — read that
    # before changing the region or adding a second one.
    # ---------------------------------------------------------------------------
    region: oregon
    branch: main
    autoDeploy: true
    # Build flow:
    #   1. install
    #   2. prisma generate (codegen for the API)
    #   3. prisma migrate deploy — apply any new migrations to the prod DB
    #      so the API doesn't query columns that don't exist yet
    #   4. turbo build the API
    # The `start` step then runs db:seed once (idempotent upserts) so any new
    # learning paths land before the API starts serving traffic.
    buildCommand: pnpm install --frozen-lockfile --prod=false && pnpm --filter @levelup/db generate && pnpm --filter @levelup/db exec prisma migrate deploy && pnpm turbo run build --filter=@levelup/api...
    startCommand: pnpm --filter @levelup/db run seed || true; pnpm --filter @levelup/api start
    healthCheckPath: /api/health
    envVars:
      - key: NODE_ENV
        value: production
      - key: API_PORT
        value: 4000

      # White-label client — drives cert PDF + email branding.
      - key: CLIENT
        value: kapitus

      # Postgres (Supabase pooler)
      - key: DATABASE_URL
        sync: false
      - key: DIRECT_DATABASE_URL
        sync: false

      # Redis (Upstash recommended)
      - key: REDIS_URL
        sync: false

      # Supabase Auth + Storage
      - key: SUPABASE_URL
        sync: false
      - key: SUPABASE_ANON_KEY
        sync: false
      - key: SUPABASE_SERVICE_ROLE_KEY
        sync: false
      - key: SUPABASE_JWT_SECRET
        sync: false

      # Cloudflare R2 (CR.26) — preferred backend for cert PDFs. Leave any
      # of the four required vars unset to fall back to Supabase Storage.
      - key: R2_ACCOUNT_ID
        sync: false
      - key: R2_ACCESS_KEY_ID
        sync: false
      - key: R2_SECRET_ACCESS_KEY
        sync: false
      - key: R2_BUCKET
        sync: false
      - key: R2_PUBLIC_BASE_URL
        sync: false

      # OpenAI (coach + embeddings + voice)
      - key: OPENAI_API_KEY
        sync: false

      # Stripe
      - key: STRIPE_SECRET_KEY
        sync: false
      - key: STRIPE_WEBHOOK_SECRET
        sync: false
      - key: STRIPE_PRICE_STARTER
        sync: false
      - key: STRIPE_PRICE_GROWTH
        sync: false
      - key: STRIPE_PRICE_ENTERPRISE
        sync: false

      # Resend (transactional email)
      - key: RESEND_API_KEY
        sync: false
      - key: RESEND_FROM_EMAIL
        sync: false

      # Cert PDF HMAC signing key (REQUIRED — boot fails without it)
      - key: CERT_SIGNING_SECRET
        generateValue: true

      # Slack OAuth state HMAC (legacy, still consumed by integrations module)
      - key: SESSION_SECRET
        generateValue: true

      # CORS / cookie config
      # Comma-separated allow-list. main.ts splits on `,` and trims whitespace.
      # ceolawyer.ailevel.app is the second tenant (CEO Lawyer) served by a
      # separate Vercel project — see docs/runbooks/ceolawyer-vercel-deploy.md.
      - key: WEB_ORIGIN
        value: https://ailevel.app,https://ceolawyer.ailevel.app
      - key: COOKIE_DOMAIN
        value: .ailevel.app
      - key: NEXT_PUBLIC_API_URL
        sync: false

  - type: worker
    name: levelup-worker
    runtime: node
    rootDir: .
    plan: starter
    # Worker stays in oregon for the same reasons as the API (DB + Redis
    # locality). On multi-region failover, only one region's worker should be
    # active at a time — see docs/runbooks/multi-region.md §4.5.
    region: oregon
    branch: main
    autoDeploy: true
    buildCommand: pnpm install --frozen-lockfile --prod=false && pnpm --filter @levelup/db generate && pnpm turbo run build --filter=@levelup/worker...
    startCommand: pnpm --filter @levelup/worker start
    envVars:
      - key: NODE_ENV
        value: production

      # White-label client — drives cert PDF + email branding.
      - key: CLIENT
        value: kapitus

      - key: DATABASE_URL
        sync: false
      - key: DIRECT_DATABASE_URL
        sync: false
      - key: REDIS_URL
        sync: false

      - key: SUPABASE_URL
        sync: false
      - key: SUPABASE_SERVICE_ROLE_KEY
        sync: false

      # Cloudflare R2 (CR.26) — worker uploads cert PDFs here when configured.
      - key: R2_ACCOUNT_ID
        sync: false
      - key: R2_ACCESS_KEY_ID
        sync: false
      - key: R2_SECRET_ACCESS_KEY
        sync: false
      - key: R2_BUCKET
        sync: false
      - key: R2_PUBLIC_BASE_URL
        sync: false

      - key: OPENAI_API_KEY
        sync: false
      - key: RESEND_API_KEY
        sync: false
      - key: RESEND_FROM_EMAIL
        sync: false

      - key: CERT_SIGNING_SECRET
        fromService:
          type: web
          name: levelup-api
          envVarKey: CERT_SIGNING_SECRET
