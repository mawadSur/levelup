services:
  - type: web
    name: levelup-api
    runtime: node
    rootDir: .
    plan: standard
    region: oregon
    buildCommand: pnpm install --frozen-lockfile && pnpm --filter @levelup/db generate && pnpm turbo run build --filter=@levelup/api...
    startCommand: pnpm --filter @levelup/api start
    healthCheckPath: /api/health
    envVars:
      - key: NODE_ENV
        value: production
      - key: API_PORT
        value: 4000
      - key: DATABASE_URL
        sync: false
      - key: DIRECT_DATABASE_URL
        sync: false
      - key: REDIS_URL
        sync: false
      - key: OPENAI_API_KEY
        sync: false
      - key: WORKOS_API_KEY
        sync: false
      - key: WORKOS_CLIENT_ID
        sync: false
      - key: STRIPE_SECRET_KEY
        sync: false
      - key: STRIPE_WEBHOOK_SECRET
        sync: false
      - key: STRIPE_PRICE_STARTER
        sync: false
      - key: STRIPE_PRICE_GROWTH
        sync: false
      - key: STRIPE_PRICE_ENTERPRISE
        sync: false
      - key: RESEND_API_KEY
        sync: false
      - key: SESSION_SECRET
        generateValue: true
      - key: WEB_ORIGIN
        sync: false
      - key: COOKIE_DOMAIN
        sync: false

  - type: worker
    name: levelup-worker
    runtime: node
    rootDir: .
    plan: starter
    region: oregon
    buildCommand: pnpm install --frozen-lockfile && pnpm --filter @levelup/db generate && pnpm turbo run build --filter=@levelup/worker...
    startCommand: pnpm --filter @levelup/worker start
    envVars:
      - key: NODE_ENV
        value: production
      - key: DATABASE_URL
        sync: false
      - key: DIRECT_DATABASE_URL
        sync: false
      - key: REDIS_URL
        sync: false
      - key: OPENAI_API_KEY
        sync: false
      - key: RESEND_API_KEY
        sync: false
